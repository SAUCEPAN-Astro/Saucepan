[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saucepan-pipeline"
version = "0.3.0"
description = "Saucepan imaging pipeline stages (calibration through stacking)"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6.0.0",
    "astroscrappy>=1.1.0",
    "numpy>=1.24.0",
    "saucepan-grading>=1.0.0",
    "photutils>=1.8.0",
    "reproject>=0.12.0",
    "scipy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["saucepan_pipeline*"]
