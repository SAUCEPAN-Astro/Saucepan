openapi: "3.1.0"

info:
  title: Saucepan Developer API
  version: "1.0.0"
  description: |
    Submit observation tasks to the Saucepan distributed telescope network
    and retrieve results via the developer inbox.

    This is the sparse developer/authentication specification. The complete
    route registry, including researcher and pier routes, is in
    `SaucepanServer/task-server/contracts/rest/routes.json`.

    ## Auth
    All task and inbox endpoints require an API key passed as `X-API-Key`.
    Key management endpoints require a JWT Bearer token obtained from `POST /auth/login`.

    ## Approval
    API keys can only be issued after:
    1. Email verification (`POST /auth/verify-email`)
    2. Manual approval by an Saucepan admin

    ## Rate limits
    Responses include `X-RateLimit-Remaining` and `X-RateLimit-Reset` headers.
    When exceeded, the API returns `429` with a `Retry-After` header.

security: []

servers:
  - url: http://127.0.0.1:8080
    description: Local reference task server

# ---------------------------------------------------------------------------
# Reusable components
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    BearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TaskSpec:
      type: object
      required: [name, integration_time, min_power]
      properties:
        name:
          type: string
          example: "M42"
        description:
          type: string
        integration_time:
          type: number
          description: Exposure time in seconds
          example: 300
        min_power:
          type: number
          minimum: 0.0
          maximum: 1.0
          description: |
            Required. Telescope capability catch-all (0.0–1.0).
            Applied after specific requirements (filters, PSF, plate scale, aperture)
            have narrowed the telescope pool. Always set this even if you set other fields.
        target_magnitude:
          type: number
          nullable: true
          description: Optional target apparent magnitude; matched against telescope limiting magnitude.
        required_filters:
          type: array
          nullable: true
          items:
            type: string
          example: ["R", "G", "B"]
          description: Optional. Filter names the telescope must have available.
        max_psf_fwhm:
          type: number
          nullable: true
          description: Optional. Maximum acceptable PSF FWHM in arcseconds.
        max_plate_scale:
          type: number
          nullable: true
          description: |
            Optional. Maximum acceptable plate scale in arcsec/pixel.
            Lower values require finer resolution. E.g. 0.5 means each pixel covers
            at most 0.5 arcseconds of sky.
        min_aperture_mm:
          type: number
          nullable: true
          description: Optional. Minimum telescope aperture in millimetres.
        priority:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: Scheduling priority. Clamped to 50 server-side.
        normalized_integration_budget_s:
          type: number
          nullable: true
          description: Optional normalized integration budget for campaign tasks.

    Task:
      type: object
      properties:
        id:
          type: string
          description: Opaque public task identifier.
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [pending, assigned, in_progress, completed, failed]
        integration_time:
          type: number
        required_filters:
          type: array
          items:
            type: string
        min_power:
          type: number
        max_psf_fwhm:
          type: number
        priority:
          type: integer
        created_at:
          type: string
          format: date-time
        developer_task_id:
          type: string
          description: Opaque public task identifier.

    Delivery:
      type: object
      properties:
        notification_id:
          type: integer
        task_id:
          type: string
        status:
          type: string
          enum: [completed, failed]
        failure_reason:
          type: string
          nullable: true
        fits_url:
          type: string
          nullable: true
          description: Short-lived signed object-store URL. Present only when status=completed.
        original_spec:
          $ref: "#/components/schemas/TaskSpec"
        acknowledged:
          type: boolean
        created_at:
          type: string
          format: date-time

    QuotaStatus:
      type: object
      properties:
        quota_total:
          type: integer
        quota_used:
          type: integer
        quota_remaining:
          type: integer
        rate_limit_per_minute:
          type: integer
        rate_limit_per_hour:
          type: integer
        rate_limit_per_day:
          type: integer

    ApiKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        key_prefix:
          type: string
          example: "sp_live_a1"
          description: First 12 characters only. Full key is shown once on creation.
        scopes:
          type: array
          items:
            type: string
            enum: [tasks:write, tasks:read, status:read]
        is_active:
          type: boolean
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ---------- Registration --------------------------------------------------

  /auth/login:
    post:
      summary: Log in a researcher account
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Access and refresh tokens
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  user:
                    type: object
        "401":
          description: Invalid credentials

  /auth/refresh:
    post:
      summary: Refresh a researcher access token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Refreshed access and refresh tokens
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                  user:
                    type: object
        "401":
          description: Invalid or expired refresh token

  /auth/register:
    post:
      summary: Register a developer account
      tags: [Registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username, password, institution, research_purpose]
              properties:
                email:
                  type: string
                  format: email
                username:
                  type: string
                password:
                  type: string
                  minLength: 8
                institution:
                  type: string
                  description: Academic institution or organisation
                research_purpose:
                  type: string
                  description: Brief description of intended use — reviewed by admin
      responses:
        "202":
          description: Registration accepted. Verification email sent.
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/verify-email:
    post:
      summary: Verify email address (step 1 of 2 before key issuance)
      tags: [Registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Email verified. Account pending admin approval.
        "400":
          description: Invalid or expired token

  # ---------- API Keys ------------------------------------------------------

  /api/v1/keys:
    get:
      summary: List your API keys
      tags: [API Keys]
      security:
        - BearerJWT: []
      responses:
        "200":
          description: List of keys (prefix + metadata only — full key never returned after creation)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          description: Invalid or expired JWT

    post:
      summary: Create a new API key
      description: |
        The full key is returned **once only** in the response.
        Store it securely — it cannot be retrieved again.
        Requires email_verified=true AND admin_approved=true.
      tags: [API Keys]
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name:
                  type: string
                  example: "prod key"
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [tasks:write, tasks:read, status:read]
                expires_in_days:
                  type: integer
                  nullable: true
                  description: Key expiry in days. Null = no expiry.
      responses:
        "201":
          description: Key created. Full key shown once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiKey"
                  - type: object
                    properties:
                      key:
                        type: string
                        example: "sp_live_a1b2c3d4e5f6..."
        "403":
          description: Account not yet verified or approved

  /api/v1/keys/{key_id}:
    delete:
      summary: Revoke an API key
      description: Sets the key inactive. The key is retained for audit purposes, not deleted.
      tags: [API Keys]
      security:
        - BearerJWT: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Key revoked
        "404":
          description: Key not found or belongs to another developer

  # ---------- Tasks ---------------------------------------------------------

  /api/v1/tasks:
    post:
      summary: Submit an observation task
      tags: [Tasks]
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskSpec"
      responses:
        "201":
          description: Task queued. Returns immediately — result arrives in inbox when complete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Invalid, revoked, or expired API key
        "403":
          description: Key does not have tasks:write scope
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit or quota exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying (rate limit only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      summary: List your submitted tasks
      tags: [Tasks]
      security:
        - ApiKey: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, completed, failed]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
          description: Task list
        "401":
          description: Invalid API key
        "403":
          description: Key does not have tasks:read scope

  /api/v1/tasks/{task_id}:
    get:
      summary: Get a task by ID
      tags: [Tasks]
      security:
        - ApiKey: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
          description: Task detail
        "404":
          description: Task not found or belongs to another developer

  /api/v1/tasks/{task_id}/download-url:
    get:
      summary: Get a short-lived signed download URL for a completed task's FITS file
      tags: [Tasks]
      security:
        - ApiKey: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
          description: Signed URL valid for 15 minutes
        "404":
          description: Task not found or not completed

  # ---------- Inbox ---------------------------------------------------------

  /api/v1/inbox:
    get:
      summary: Poll the inbox for task completion notifications
      description: |
        Without `?all=true`: returns only unacknowledged deliveries (default).
        With `?all=true`: returns full history including acknowledged deliveries.
      tags: [Inbox]
      security:
        - ApiKey: []
      parameters:
        - name: all
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Delivery"
          description: Deliveries

  /api/v1/inbox/{notification_id}:
    patch:
      summary: Acknowledge a delivery
      description: Marks the notification as seen. It will no longer appear in the default poll.
      tags: [Inbox]
      security:
        - ApiKey: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledged:
                  type: boolean
                  example: true
      responses:
        "200":
          description: Acknowledged
        "404":
          description: Notification not found or belongs to another developer

  /api/v1/inbox/{notification_id}/ack:
    post:
      summary: Acknowledge a delivery (alias of PATCH /inbox/{notification_id})
      description: |
        Same effect as `PATCH /inbox/{notification_id}` with
        `{"acknowledged": true}`; provided for clients that prefer a POST.
      tags: [Inbox]
      security:
        - ApiKey: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Acknowledged
        "404":
          description: Notification not found or belongs to another developer

  # ---------- Developer self-service ----------------------------------------

  /api/v1/me:
    get:
      summary: Get your developer profile and approval status
      tags: [Developer]
      security:
        - BearerJWT: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  email:
                    type: string
                  institution:
                    type: string
                  email_verified:
                    type: boolean
                  admin_approved:
                    type: boolean
                  is_active:
                    type: boolean
          description: Developer profile

  /api/v1/me/quota:
    get:
      summary: Get your current quota and rate limit status
      tags: [Developer]
      security:
        - ApiKey: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaStatus"
          description: Quota status
